[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircanvas"
version = "1.0.0"
description = "AirCanvas — Paint Without Touching Anything: a touchless, gesture-controlled digital painting studio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AirCanvas" }]

dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "pygame>=2.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aircanvas = "aircanvas.cli:main"

[tool.setuptools.packages.find]
include = ["aircanvas*"]
